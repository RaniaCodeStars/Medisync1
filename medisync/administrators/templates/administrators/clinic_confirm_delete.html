{% extends 'administrators/base_admin.html' %}

{% block content %}
<div class="container-fluid py-4">
    <div class="row">
        <div class="col-12">
            <div class="card mb-4">
                <div class="card-header pb-0">
                    <h5>Confirmer la suppression</h5>
                </div>
                <div class="card-body">
                    <p>Êtes-vous sûr de vouloir supprimer la clinique <strong>{{ object.name }}</strong> ?</p>
                    <p class="text-danger">Cette action est irréversible et supprimera également tous les médecins associés.</p>
                    
                    <form method="post">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-danger">Confirmer la suppression</button>
                        <a href="{% url 'administrators:clinic-list' %}" class="btn btn-secondary">Annuler</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
