<h2>Validation des Médecins</h2>
{% if medecins_en_attente %}
    <ul>
        {% for medecin in medecins_en_attente %}
            <li>
                {{ medecin.user.username }} - 
                <form method="POST" style="display:inline;">
                    {% csrf_token %}
                    <input type="hidden" name="user_id" value="{{ medecin.user.id }}">
                    <button type="submit">Valider</button>
                </form>
            </li>
        {% endfor %}
    </ul>
{% else %}
    <p>Aucun médecin en attente de validation.</p>
{% endif %}
