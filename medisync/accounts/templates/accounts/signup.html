<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
{% load static %}

<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow">
                <div class="card-header bg-primary text-white">
                    <h3 class="mb-0">Inscription</h3>
                </div>
                <div class="card-body">
                    {% if messages %}
                        {% for message in messages %}
                            <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                                {{ message }}
                                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                                    <span aria-hidden="true">&times;</span>
                                </button>
                            </div>
                        {% endfor %}
                    {% endif %}

                    <form method="post" enctype="multipart/form-data" id="signupForm">
                        {% csrf_token %}
                        
                        <!-- Choix du rôle -->
                        <div class="form-group">
                            <label for="id_role">Je m'inscris en tant que :</label>
                            <select class="form-control" name="role" id="id_role" required>
                                <option value="">Sélectionnez un rôle</option>
                                {% for value, label in form.role.field.choices %}
                                    {% if value %}
                                        <option value="{{ value }}">{{ label }}</option>
                                    {% endif %}
                                {% endfor %}
                            </select>
                        </div>

                        <!-- Champs communs à tous les rôles -->
                        <div class="form-group">
                            <label for="id_email">Email</label>
                            <input type="email" class="form-control" name="email" id="id_email" required>
                        </div>

                        <div class="form-group">
                            <label for="id_username">Nom d'utilisateur</label>
                            <input type="text" class="form-control" name="username" id="id_username" required>
                        </div>

                        <div class="form-group">
                            <label for="id_password1">Mot de passe</label>
                            <input type="password" class="form-control" name="password1" id="id_password1" required>
                        </div>

                        <div class="form-group">
                            <label for="id_password2">Confirmer le mot de passe</label>
                            <input type="password" class="form-control" name="password2" id="id_password2" required>
                        </div>

                        <!-- Champs spécifiques aux médecins -->
                        <div id="doctorFields" style="display: none;">
                            <div class="form-group">
                                <label for="id_nom">Nom</label>
                                <input type="text" class="form-control" name="nom" id="id_nom">
                            </div>

                            <div class="form-group">
                                <label for="id_prenom">Prénom</label>
                                <input type="text" class="form-control" name="prenom" id="id_prenom">
                            </div>

                            <div class="form-group">
                                <label for="id_specialty">Spécialité</label>
                                <select class="form-control" name="specialty" id="id_specialty">
                                    {% for specialty in specialties %}
                                        <option value="{{ specialty.id }}">{{ specialty.nom }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="id_experience">Années d'expérience</label>
                                <input type="number" class="form-control" name="experience" id="id_experience">
                            </div>

                            <div class="form-group">
                                <label for="id_prix">Prix de consultation (DA)</label>
                                <input type="number" step="0.01" class="form-control" name="prix" id="id_prix" value="3000.00">
                            </div>

                            <div class="form-group">
                                <label for="id_institution">Institution</label>
                                <input type="text" class="form-control" name="institution" id="id_institution">
                            </div>

                            <div class="form-group">
                                <label for="id_location">Localisation</label>
                                <select class="form-control" name="location" id="id_location">
                                    {% for wilaya in wilaya_choices %}
                                        <option value="{{ wilaya.0 }}">{{ wilaya.1 }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="id_default_duration">Durée par défaut des RDV (minutes)</label>
                                <input type="number" class="form-control" name="default_duration" id="id_default_duration" value="30">
                            </div>

                            <div class="form-group form-check">
                                <input type="checkbox" class="form-check-input" name="accept_online_appointments" id="id_accept_online_appointments">
                                <label class="form-check-label" for="id_accept_online_appointments">Accepte les rendez-vous en ligne</label>
                            </div>

                            <div class="form-group">
                                <label for="id_profile_picture">Photo de profil</label>
                                <input type="file" class="form-control-file" name="profile_picture" id="id_profile_picture">
                            </div>

                            <div class="form-group">
                                <label for="id_minimum_delay">Délai minimum pour RDV (jours)</label>
                                <input type="number" class="form-control" name="minimum_delay" id="id_minimum_delay" value="1">
                            </div>

                            <div class="form-group">
                                <label for="id_maximum_delay">Délai maximum pour RDV (jours)</label>
                                <input type="number" class="form-control" name="maximum_delay" id="id_maximum_delay" value="90">
                            </div>

                            <div class="form-group">
                                <label for="id_compte_RIP">Compte RIP (optionnel)</label>
                                <input type="text" class="form-control" name="compte_RIP" id="id_compte_RIP">
                            </div>
                        </div>

                        <!-- Champs spécifiques aux patients -->
                        <div id="patientFields" style="display: none;">
                            <div class="form-group">
                                <label for="id_nom">Nom</label>
                                <input type="text" class="form-control" name="nom" id="id_nom_patient">
                            </div>

                            <div class="form-group">
                                <label for="id_prenom">Prénom</label>
                                <input type="text" class="form-control" name="prenom" id="id_prenom_patient">
                            </div>

                            <div class="form-group">
                                <label for="id_sex">Sexe</label>
                                <select class="form-control" name="sex" id="id_sex">
                                    <option value="M">Masculin</option>
                                    <option value="F">Féminin</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="id_blood_group">Groupe sanguin (optionnel)</label>
                                <select class="form-control" name="blood_group" id="id_blood_group">
                                    <option value="">Non spécifié</option>
                                    <option value="A+">A+</option>
                                    <option value="A-">A-</option>
                                    <option value="B+">B+</option>
                                    <option value="B-">B-</option>
                                    <option value="AB+">AB+</option>
                                    <option value="AB-">AB-</option>
                                    <option value="O+">O+</option>
                                    <option value="O-">O-</option>
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="id_allergies">Allergies (optionnel)</label>
                                <textarea class="form-control" name="allergies" id="id_allergies" rows="3"></textarea>
                            </div>

                            <div class="form-group">
                                <label for="id_date_of_birth">Date de naissance (optionnel)</label>
                                <input type="date" class="form-control" name="date_of_birth" id="id_date_of_birth">
                            </div>

                            <div class="form-group">
                                <label for="id_phone">Téléphone (optionnel)</label>
                                <input type="text" class="form-control" name="phone" id="id_phone">
                            </div>
                        </div>

                        <!-- Champs spécifiques aux pharmaciens -->
                        <div id="pharmacistFields" style="display: none;">
                            <div class="form-group">
                                <label for="id_pharmacy_name">Nom de la pharmacie</label>
                                <input type="text" class="form-control" name="pharmacy_name" id="id_pharmacy_name">
                            </div>

                            <div class="form-group">
                                <label for="id_pharmacy_address">Adresse de la pharmacie (optionnel)</label>
                                <input type="text" class="form-control" name="pharmacy_address" id="id_pharmacy_address">
                            </div>
                        </div>

                        <!-- Champs spécifiques aux cliniques -->
                        <div id="clinicFields" style="display: none;">
                            <div class="form-group">
                                <label for="id_name">Nom de la clinique</label>
                                <input type="text" class="form-control" name="name" id="id_name">
                            </div>

                            <div class="form-group">
                                <label for="id_phone">Téléphone</label>
                                <input type="text" class="form-control" name="phone" id="id_phone_clinic">
                            </div>

                            <div class="form-group">
                                <label for="id_adresse">Adresse</label>
                                <input type="text" class="form-control" name="adresse" id="id_adresse">
                            </div>

                            <div class="form-group">
                                <label for="id_location">Localisation</label>
                                <select class="form-control" name="location" id="id_location_clinic">
                                    {% for wilaya in wilaya_choices %}
                                        <option value="{{ wilaya.0 }}">{{ wilaya.1 }}</option>
                                    {% endfor %}
                                </select>
                            </div>

                            <div class="form-group">
                                <label for="id_email">Email (optionnel)</label>
                                <input type="email" class="form-control" name="email" id="id_email_clinic">
                            </div>

                            <div class="form-group">
                                <label for="id_description">Description</label>
                                <textarea class="form-control" name="description" id="id_description" rows="5" required></textarea>
                            </div>

                            <div class="form-group">
                                <label for="id_photos">Photo de la clinique (optionnel)</label>
                                <input type="file" class="form-control-file" name="photos" id="id_photos">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-block mt-4">S'inscrire</button>
                    </form>

                    <div class="text-center mt-3">
                        <p>Déjà inscrit ? <a href="{% url 'accounts:login' %}">Connectez-vous</a></p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const roleSelect = document.getElementById('id_role');
    const doctorFields = document.getElementById('doctorFields');
    const patientFields = document.getElementById('patientFields');
    const pharmacistFields = document.getElementById('pharmacistFields');
    const clinicFields = document.getElementById('clinicFields');

    function toggleFields() {
        const selectedRole = roleSelect.value;
        
        // Hide all fields first
        doctorFields.style.display = 'none';
        patientFields.style.display = 'none';
        pharmacistFields.style.display = 'none';
        clinicFields.style.display = 'none';
        
        // Show fields based on selected role
        if (selectedRole === 'MEDECIN') {
            doctorFields.style.display = 'block';
        } else if (selectedRole === 'PATIENT') {
            patientFields.style.display = 'block';
        } else if (selectedRole === 'PHARMACIEN') {
            pharmacistFields.style.display = 'block';
        } else if (selectedRole === 'CLINIC') {
            clinicFields.style.display = 'block';
        }
    }

    // Initial call to set correct fields on page load
    toggleFields();
    
    // Add event listener for role changes
    roleSelect.addEventListener('change', toggleFields);
});
document.addEventListener('DOMContentLoaded', function() {
    const roleSelect = document.getElementById('id_role');
    const doctorFields = document.getElementById('doctorFields');
    const patientFields = document.getElementById('patientFields');
    const pharmacistFields = document.getElementById('pharmacistFields');
    const clinicFields = document.getElementById('clinicFields');
    const descriptionField = document.getElementById('id_description');

    function toggleFields() {
        const selectedRole = roleSelect.value;
        
        // Hide all fields first
        doctorFields.style.display = 'none';
        patientFields.style.display = 'none';
        pharmacistFields.style.display = 'none';
        clinicFields.style.display = 'none';
        
        // Remove required from all fields that might be hidden
        descriptionField.removeAttribute('required');
        
        // Show fields based on selected role
        if (selectedRole === 'MEDECIN') {
            doctorFields.style.display = 'block';
        } else if (selectedRole === 'PATIENT') {
            patientFields.style.display = 'block';
        } else if (selectedRole === 'PHARMACIEN') {
            pharmacistFields.style.display = 'block';
        } else if (selectedRole === 'CLINIC') {
            clinicFields.style.display = 'block';
            descriptionField.setAttribute('required', 'required');
        }
    }

    // Initial call to set correct fields on page load
    toggleFields();
    
    // Add event listener for role changes
    roleSelect.addEventListener('change', toggleFields);
});
</script>

</body>
</html>
